name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v2.0.5'
        required: true
        type: string
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: '24.x'

concurrency:
  group: release-${{ github.ref_name || inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json
            language-server/package-lock.json

      # npm 11.6.2 has a false-positive `npm ls` bug that flags strip-ansi@7.2.0
      # as invalid for ^7.0.1 (it satisfies it), which aborts `vsce package`.
      # Pin a known-good npm so the Marketplace packaging step is deterministic.
      - name: Pin npm
        run: npm install -g npm@10.9.2

      - name: Resolve Release Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            raw_version="${{ inputs.version }}"
          else
            raw_version="${GITHUB_REF_NAME}"
          fi

          tag_name="${raw_version#refs/tags/}"
          if [[ "$tag_name" != v* ]]; then
            tag_name="v$tag_name"
          fi

          {
            echo "tag_name=$tag_name"
            echo "version=${tag_name#v}"
          } >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prerelease }}" = "true" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Dependencies
        run: |
          npm ci
          npm --prefix extension ci
          npm --prefix language-server ci

      - name: Regenerate Command Surfaces
        run: npm run gofer:generate

      - name: Run Tests
        run: npm test
        env:
          CI: true

      - name: Build Components
        run: |
          npm run build
          npm --prefix extension run compile
          npm --prefix language-server run build

      - name: Package VS Code Extension
        working-directory: ./extension
        run: npx @vscode/vsce package --out "eai-gofer-${{ steps.version.outputs.version }}.vsix"

      - name: Package Agent Plugin
        run: npm run gofer:package-plugin -- --version "${{ steps.version.outputs.version }}" --sync-repo

      - name: Azure Login for VS Code Marketplace Publish
        if: steps.version.outputs.prerelease != 'true' && vars.VSCE_AZURE_CLIENT_ID != '' && vars.VSCE_AZURE_TENANT_ID != '' && vars.VSCE_AZURE_SUBSCRIPTION_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.VSCE_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.VSCE_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.VSCE_AZURE_SUBSCRIPTION_ID }}

      - name: Resolve VS Marketplace Identity
        if: steps.version.outputs.prerelease != 'true' && vars.VSCE_AZURE_CLIENT_ID != '' && vars.VSCE_AZURE_TENANT_ID != '' && vars.VSCE_AZURE_SUBSCRIPTION_ID != ''
        run: |
          marketplace_identity_id="$(az rest \
            --uri https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query id \
            --output tsv)"

          echo "::notice title=VS Marketplace managed identity::If publish is unauthorized, add this managed identity resource ID as a Contributor on the EnterpriseAI Marketplace publisher: $marketplace_identity_id"

      - name: Publish VS Code Marketplace Extension
        working-directory: ./extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSCE_AZURE_CLIENT_ID: ${{ vars.VSCE_AZURE_CLIENT_ID }}
          VSCE_AZURE_TENANT_ID: ${{ vars.VSCE_AZURE_TENANT_ID }}
          VSCE_AZURE_SUBSCRIPTION_ID: ${{ vars.VSCE_AZURE_SUBSCRIPTION_ID }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "Skipping VS Code Marketplace publish for prerelease."
            exit 0
          fi

          if [ -n "$VSCE_AZURE_CLIENT_ID" ] && [ -n "$VSCE_AZURE_TENANT_ID" ] && [ -n "$VSCE_AZURE_SUBSCRIPTION_ID" ]; then
            echo "Publishing EnterpriseAI.gofer with Microsoft Entra ID workload identity."
            if npx @vscode/vsce verify-pat EnterpriseAI --azure-credential \
              && npx @vscode/vsce publish --packagePath "eai-gofer-${{ steps.version.outputs.version }}.vsix" --azure-credential; then
              exit 0
            fi

            if [ -n "$VSCE_PAT" ]; then
              echo "::warning::Microsoft Entra Marketplace publish failed; falling back to legacy VSCE_PAT. Add the managed identity reported above as a Contributor on the EnterpriseAI Marketplace publisher before removing this fallback."
            else
              echo "::error::Microsoft Entra Marketplace publish failed and no VSCE_PAT fallback is configured."
              exit 1
            fi
          fi

          if [ -n "$VSCE_PAT" ]; then
            echo "::warning::Publishing EnterpriseAI.gofer with legacy VSCE_PAT fallback. Configure Entra workload identity publishing before Azure DevOps global PAT retirement."
            npx @vscode/vsce verify-pat EnterpriseAI -p "$VSCE_PAT"
            npx @vscode/vsce publish --packagePath "eai-gofer-${{ steps.version.outputs.version }}.vsix" -p "$VSCE_PAT"
            exit 0
          fi

          echo "::error::Stable releases must publish EnterpriseAI.gofer to the VS Code Marketplace."
          echo "::error::Preferred setup: configure repository variables VSCE_AZURE_CLIENT_ID, VSCE_AZURE_TENANT_ID, and VSCE_AZURE_SUBSCRIPTION_ID for an Entra workload identity that is a Contributor on the EnterpriseAI Marketplace publisher."
          echo "::error::Legacy fallback: configure VSCE_PAT with Marketplace Manage scope."
          exit 1

      - name: Create Release Archive
        run: |
          mkdir -p release-assets/orchestrator release-assets/extension release-assets/language-server

          cp -R dist/. release-assets/orchestrator/
          cp -R extension/dist/. release-assets/extension/
          cp -R language-server/dist/. release-assets/language-server/
          cp "extension/eai-gofer-${{ steps.version.outputs.version }}.vsix" release-assets/
          cp "dist/eai-gofer-agent-plugin-${{ steps.version.outputs.version }}.zip" release-assets/
          cp README.md CHANGELOG.md LICENSE release-assets/

          tar -czf "gofer-${{ steps.version.outputs.tag_name }}.tar.gz" release-assets/

      - name: Generate Release Notes
        run: |
          tag_name="${{ steps.version.outputs.tag_name }}"

          {
            echo "# Gofer $tag_name"
            echo
            echo "## Changes"
            echo
          } > release-notes.md

          if git describe --tags --abbrev=0 HEAD~1 >/dev/null 2>&1; then
            last_tag="$(git describe --tags --abbrev=0 HEAD~1)"
            echo "Changes since $last_tag:" >> release-notes.md
            git log --pretty=format:"- %s" "$last_tag"..HEAD >> release-notes.md
          else
            echo "- Initial release" >> release-notes.md
          fi

          {
            echo
            echo "## Assets"
            echo
            echo "- VS Code extension package"
            echo "- Claude/Codex/Copilot/Gemini public bundle package"
            echo "- Gofer release archive"
            echo
            echo "## Public Release Host"
            echo
            echo "https://eai-tools.github.io/eai-gofer/releases/"
            echo
            echo "## Public Agent Plugin Install"
            echo
            echo '```bash'
            echo "curl -fsSL https://eai-tools.github.io/eai-gofer/releases/eai-gofer-agent-plugin-${{ steps.version.outputs.version }}.zip \\"
            echo "  -o /tmp/eai-gofer-agent-plugin-${{ steps.version.outputs.version }}.zip"
            echo
            echo "rm -rf ~/plugins/eai-gofer"
            echo "unzip /tmp/eai-gofer-agent-plugin-${{ steps.version.outputs.version }}.zip -d ~/plugins"
            echo '```'
            echo
            echo "Claude Code:"
            echo
            echo '```bash'
            echo "claude plugin marketplace add https://github.com/eai-tools/eai-gofer --scope user --sparse .claude-plugin --sparse plugins/eai-gofer"
            echo "claude plugin install eai-gofer@eai-gofer --scope user"
            echo '```'
            echo
            echo "Codex:"
            echo
            echo '```bash'
            echo "codex plugin marketplace add https://github.com/eai-tools/eai-gofer --sparse .agents/plugins --sparse plugins/eai-gofer"
            echo "codex plugin add eai-gofer@eai-gofer"
            echo '```'
            echo
            echo "Gemini CLI:"
            echo
            echo '```bash'
            echo "gemini extensions install https://github.com/eai-tools/eai-gofer"
            echo '```'
            echo
            echo "Copilot CLI:"
            echo
            echo '```bash'
            echo "copilot plugin marketplace add https://github.com/eai-tools/eai-gofer"
            echo "copilot plugin install eai-gofer@eai-gofer"
            echo '```'
          } >> release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Gofer ${{ steps.version.outputs.tag_name }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            gofer-${{ steps.version.outputs.tag_name }}.tar.gz
            extension/eai-gofer-${{ steps.version.outputs.version }}.vsix
            dist/eai-gofer-agent-plugin-${{ steps.version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
