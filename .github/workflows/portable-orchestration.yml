name: Portable Orchestration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  portable-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run gofer:orchestration:check
      - run: npm run gofer:orchestration:test
