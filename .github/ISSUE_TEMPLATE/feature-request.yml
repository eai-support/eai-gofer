name: Feature request
description: Suggest a new capability, workflow improvement, or host integration enhancement
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Name the issue for the outcome needed: Prevent [risk] for [user or system] by [needed capability]. Example: Prevent broken EAI app data links caused by inconsistent Object Type slugs. Keep the title concise and in business language. A prefix such as CURATE: may identify a programme, but it must not replace the outcome.
        Please keep examples public-safe. Do not attach ZIPs, scripts, installers, binaries, or fix archives; unsolicited executable/archive attachments may be removed by maintainers.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What is hard, missing, or frustrating today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior you want.
    validations:
      required: true
  - type: dropdown
    id: surfaces
    attributes:
      label: Most affected surface
      options:
        - VS Code
        - Claude Code
        - Codex
        - GitHub Copilot
        - Gemini
        - Docs / site
        - Release / packaging
        - Cross-platform
    validations:
      required: true
  - type: dropdown
    id: roadmap_area
    attributes:
      label: Roadmap area
      description: Choose the closest public Gofer workstream.
      options:
        - Public launch and repo hygiene
        - Onboarding and docs
        - Cross-host install/update parity
        - Release and packaging
        - Community and contributor experience
        - Validation and CI quality
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
