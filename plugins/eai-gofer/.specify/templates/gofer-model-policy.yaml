# Gofer model policy
#
# Bootstrap copies this template only when .specify/memory/gofer-model-policy.yaml
# is missing. The memory copy is user-owned: never overwrite it on an update.
# Existing model IDs and aliases are preferences, not forced or verified routes.
# No model catalog has been verified by shipping this file.
version: 1
lastVerified: ''
profile: balanced

principles:
  - Preserve the current native host selection for standard work; omit model and reasoning overrides.
  - When a delegated tier choice is needed, prefer the lowest-cost verified-capable advertised option, including for repetitive work, using current supported cost evidence; never rank by name or guess prices.
  - Discover the exact models advertised by the current host, surface and authenticated account before an explicit model choice.
  - Bind host identity to the concrete CLI or desktop client instance and launch profile, not just the provider name.
  - Require verified discovery evidence no older than five minutes and before its expiry.
  - Reject catalogs or approvals from another host, surface, authentication, permission or cost context.
  - Treat legacy model IDs and aliases as exact preferences; reject them when not advertised or unavailable.
  - Do not infer capability, freshness, price or permission from model names, aliases, version numbers or lexical sorting.
  - Hard and arbiter tiers require verified tier-specific qualification, not a claim that the native model is strongest.
  - If an arbiter route is missing, use the hard route as the preference, never the medium route; arbiter qualification is still required.
  - Require approval for the exact model and reasoning selection in the same permission and cost context.
  - Validate reasoning effort as an exact advertised native string; do not use a fixed enum or infer strength from that string.
  - Never change authentication, permissions, budgets or paid access to make a model route available.
  - Preserve all tiers without requiring a model switch; high throughput is a workload intent, not a speed or cost guarantee.
  - Keep provider caching limited to stable non-secret prefixes and retain checkpoint and context controls.

contextPolicy:
  healthyBelowPercent: 40
  summarizeAtPercent: 55
  compactAtPercent: 70
  checkpointAtPercent: 85
  durableArtifact: .specify/specs/{feature}/context-bundle.md

# model: "" means no launch override, not an ID to send to a provider.
# A non-empty user preference requires the verified-catalog resolver before launch.
# The provider launch defaults are a separate integration boundary.
surfaces:
  claude:
    mechanical:
      model: ''
      selection: host-current
      requiresQualification: false
      useFor: locate, classify, extract, summarize, and transform text
    simple:
      model: ''
      selection: host-current
      requiresQualification: false
      useFor: focused low-risk coding, routine edits, and test fixes
    medium:
      model: ''
      selection: host-current
      requiresQualification: false
      useFor: normal planning, implementation, research synthesis, and validation
    hard:
      model: ''
      selection: host-current
      requiresQualification: true
      useFor: hard debugging, security, architecture, and release-critical review
    arbiter:
      model: ''
      selection: host-current
      requiresQualification: true
      useFor: independent arbitration of contradictory or release-critical findings
    highThroughputCoding:
      model: ''
      selection: host-current
      requiresQualification: false
      useFor: high-throughput coding only after capability and cost checks
    note: Discover the exact current host, surface and authenticated account catalog before any explicit model choice.
